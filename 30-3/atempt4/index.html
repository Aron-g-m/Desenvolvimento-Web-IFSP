<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Modern Design - Aron</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <!-- Theme Toggle -->
  <input type="checkbox" id="tema">
  <label for="tema" class="theme-switch">
    <div class="slider"></div>
  </label>

  <!-- Hamburger Menu Toggle -->
  <input type="checkbox" id="menu-toggle">
  <label for="menu-toggle" class="hamburger">
    <span></span>
    <span></span>
    <span></span>
  </label>

  <!-- Hidden Navigation Menu -->
  <nav class="menu-lateral">
    <ul class="menu-list">
      <li><a href="#home">Home</a></li>
      <li><a href="#about">Sobre</a></li>
      <li><a href="#project">Projeto</a></li>
      <li><a href="#contact">Contato</a></li>
    </ul>
  </nav>

  <!-- Main Content -->
  <div class="container-principal">
    <!-- Header -->
    <header class="header">
      <h1>Bem-vindo</h1>
      <p>Design moderno com Menu Escondido</p>
    </header>

    <!-- Main Content Grid -->
    <main class="conteudo">
      <section class="secao-grid">
        <h2>Nossos Serviços</h2>
        <div class="grid-container">
          <div class="grid-item">
            <p>Card 1</p>
          </div>
          <div class="grid-item">
            <p>Card 2</p>
          </div>
          <div class="grid-item">
            <p>Card 3</p>
          </div>
        </div>
      </section>


    <!-- Footer -->
    <footer class="footer">
      <p>&copy; 2025 FlexSite. Todos os direitos reservados.</p>
    </footer>
  </div>
</body>
</html>
