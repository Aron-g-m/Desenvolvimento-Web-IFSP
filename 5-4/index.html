<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerenciador de Tarefas</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

    <div class="container py-5">
        <h2 class="text-center mb-4">Gerenciador de Tarefas</h2>
        
        <div class="card p-4 mb-4">
            <div class="row g-3">
                <div class="col-md-6">
                    <input type="text" id="taskInput" class="form-control" placeholder="Título da tarefa">
                </div>
                <div class="col-md-4">
                    <select id="priorityInput" class="form-select">
                        <option value="bg-danger text-white">Prioridade Alta</option>
                        <option value="bg-warning text-dark" selected>Prioridade Média</option>
                        <option value="bg-success text-white">Prioridade Baixa</option>
                    </select>
                </div>
                <div class="col-md-2">
                    <button onclick="addTask()" class="btn btn-primary w-100">Adicionar</button>
                </div>
            </div>
        </div>

        <div id="taskContainer" class="row row-cols-1 row-cols-md-3 g-4"></div>
    </div>

    <script src="script.js"></script>
</body>
</html>
