<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Primeira API</title>
</head>
<body>

    <script>
        async function buscarUsuarios() {
            try {
                const resposta = await fetch("https://jsonplaceholder.typicode.com/users");
                const dados = await resposta.json();

                console.log(dados);
            } catch (erro) {
                console.log("Erro:", erro);
            }
        }

        buscarUsuarios();
    </script>

</body>
</html>
