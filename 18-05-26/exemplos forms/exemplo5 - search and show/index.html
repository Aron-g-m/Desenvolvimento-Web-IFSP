<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Busca de Usuários</title>
</head>
<body>

    <h2>Buscar Usuário</h2>

    <input type="text" id="busca" placeholder="Digite um nome">
    <button onclick="filtrar()">Buscar</button>

    <div id="resultado"></div>

    <script>
        let usuarios = [];

        async function carregarUsuarios() {
            const resposta = await fetch("https://jsonplaceholder.typicode.com/users");
            usuarios = await resposta.json();
        }

        function filtrar() {
            const texto = document.querySelector("#busca").value.toLowerCase();

            const filtrados = usuarios.filter(user =>
                user.name.toLowerCase().includes(texto)
            );

            mostrarNaTela(filtrados);
        }

        function mostrarNaTela(lista) {
            const div = document.querySelector("#resultado");
            div.innerHTML = "";

            if (lista.length === 0) {
                div.textContent = "Nenhum usuário encontrado";
                return;
            }

            lista.forEach(user => {
                const p = document.createElement("p");
                p.textContent = `${user.name} - ${user.email}`;
                div.appendChild(p);
            });
        }

        carregarUsuarios();
    </script>

</body>
</html>
