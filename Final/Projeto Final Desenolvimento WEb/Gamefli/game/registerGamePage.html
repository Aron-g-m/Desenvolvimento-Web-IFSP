<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register Game - GameFli</title>
    <link href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../../assets/css/homePage.css">
</head>
<body>
    <header class="custom-bg-primary text-white p-3 d-flex justify-content-between align-items-center">
        <div class="logo">
            <a href="../homePage.html">
                <img src="../../assets/imgs/icons/text1.svg" alt="GameFli Logo" class="img-fluid" style="height: 40px;">
            </a>
        </div>
            <div id="auth-info" class="d-flex align-items-center ml-2"></div>
    </header>
    <main class="container my-4">
        <h1 class="text-center">Register New Game</h1>
        <form id="game-form">
            <div class="form-group">
                <label for="game-name">Game Name</label>
                <input type="text" id="game-name" name="game-name" class="form-control" required>
            </div>
            <div class="form-group">
                <label for="game-photo">Game Photo</label>
                <input type="file" id="game-photo" name="game-photo" class="form-control" accept="image/*" required>
                <img id="preview" src="" alt="Image preview" style="display: none; max-width: 100%; margin-top: 10px;">
            </div>
            <div class="form-group">
                <label for="game-description">Description</label>
                <textarea id="game-description" name="game-description" class="form-control" rows="3" required></textarea>
            </div>
            <div class="form-group">
                <label for="game-age-rating">Age Rating</label>
                <input type="text" id="game-age-rating" name="game-age-rating" class="form-control" required>
            </div>
            <button type="submit" class="btn custom-bg-accent text-white">Register Game</button>
        </form>
        <div id="message" class="mt-3"></div>
    </main>
    <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.9.2/dist/umd/popper.min.js"></script>
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
    <script src="../../assets/js/classes/Jogo.js"></script>
    <script src="../../assets/js/classes/Usuario.js"></script>
    <script src="../../assets/js/game/registerGamePage.js"></script>
</body>
</html>
